<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6fa8">
<title>For Parul 💗 | A Birthday Surprise</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Pacifico&display=swap');
:root{
  --pink:#ff6fa8;--pink2:#ffb6d2;--rose:#ff477e;--cream:#fff8fb;
  --ink:#3c2732;--glass:rgba(255,255,255,.62);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:#fff3f8}
body{overflow-x:hidden}
button{font:inherit}
#app{min-height:100vh;position:relative;overflow:hidden}
.bg{position:fixed;inset:0;z-index:-2;background:
 radial-gradient(circle at 15% 15%,#ffd9e8 0 12%,transparent 30%),
 radial-gradient(circle at 85% 20%,#e9dcff 0 10%,transparent 28%),
 radial-gradient(circle at 50% 100%,#ffe5b8 0 10%,transparent 32%),
 linear-gradient(135deg,#fff9fc,#ffeef6 50%,#f7efff)}
.noise{position:fixed;inset:0;z-index:-1;opacity:.16;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E")}
.screen{min-height:100vh;padding:34px 20px 90px;display:none;align-items:center;justify-content:center}
.screen.active{display:flex;animation:in .75s ease both}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.card{width:min(720px,100%);text-align:center;padding:34px 22px}
.kicker{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:#c75a83}
h1,h2{margin:0}
.script{font-family:Pacifico,cursive;font-weight:400}
.hero-title{font-size:clamp(3rem,14vw,7rem);line-height:.98;color:#ff477e;text-shadow:0 8px 35px #ffb6d266}
.sub{font-size:clamp(1rem,4vw,1.2rem);line-height:1.65;max-width:550px;margin:18px auto;color:#6f5360}
.btn{border:0;border-radius:999px;padding:15px 24px;background:#ff477e;color:white;font-weight:700;cursor:pointer;box-shadow:0 14px 35px #ff477e44;transition:.2s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px)} .btn:active{transform:scale(.97)}
.btn.alt{background:#fff;color:#b83f6a;border:1px solid #ffd0e0;box-shadow:0 10px 25px #d67b9a22}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:25px}
.orb{width:150px;height:150px;margin:0 auto 28px;border-radius:50%;background:linear-gradient(145deg,#fff,#ffd0e2);box-shadow:0 30px 70px #e56b9b44;display:grid;place-items:center;font-size:4.5rem;animation:float 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(2deg)}}
.envelope{width:min(430px,90vw);height:280px;margin:24px auto;position:relative;cursor:pointer;perspective:900px}
.env-body{position:absolute;inset:20px 0 0;background:#ffabc9;border-radius:16px;box-shadow:0 25px 50px #b33d6b28}
.env-body:after,.env-body:before{content:"";position:absolute;bottom:0;width:0;height:0;border-style:solid}
.env-body:before{left:0;border-width:140px 215px 0;border-color:#ff91b7 transparent transparent}
.env-body:after{right:0;border-width:0 215px 140px;border-color:transparent #ff82ad transparent transparent}
.flap{position:absolute;left:0;top:20px;width:0;height:0;border-left:215px solid transparent;border-right:215px solid transparent;border-top:145px solid #ffbdd4;transform-origin:top;transition:1s;z-index:3;filter:drop-shadow(0 5px 5px #a33a5d22)}
.envelope.open .flap{transform:rotateX(180deg);z-index:1}
.letter{position:absolute;z-index:2;background:#fffdf9;width:82%;height:190px;left:9%;top:48px;border-radius:10px;padding:24px;text-align:left;transition:1s;box-shadow:0 10px 30px #9b4e6922;overflow:auto}
.envelope.open .letter{transform:translateY(-115px)}
.letter h3{margin:0 0 8px;font-family:Pacifico;color:#e84c82;font-size:1.5rem}
.letter p{line-height:1.65;margin:6px 0;font-size:.95rem}
.badge{display:inline-block;background:#fff;border:1px solid #ffd2e2;padding:8px 12px;border-radius:999px;color:#b84b70;font-size:.82rem;font-weight:700}
.section-title{font-size:clamp(2.2rem,9vw,4.2rem);color:#e94e82;margin:10px 0}
.funny-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:24px auto;max-width:560px}
.joke{background:var(--glass);backdrop-filter:blur(14px);border:1px solid #fff;border-radius:24px;padding:22px;min-height:120px;display:grid;place-items:center;font-weight:600;box-shadow:0 15px 35px #b75b7d18}
.joke span{font-size:2rem;display:block;margin-bottom:7px}
.cake-wrap{position:relative;width:260px;height:270px;margin:20px auto}
.cake{position:absolute;left:25px;bottom:15px;width:210px;height:125px;background:linear-gradient(#ff9fc0,#ff6e9e);border-radius:18px 18px 28px 28px;box-shadow:0 25px 35px #c3426a30}
.cake:before{content:"";position:absolute;left:0;right:0;top:-25px;height:48px;background:#fff;border-radius:50%;box-shadow:inset 0 -8px #ffd1df}
.candle{position:absolute;bottom:130px;width:14px;height:62px;border-radius:8px;background:repeating-linear-gradient(135deg,#fff 0 7px,#ff6fa8 7px 14px);z-index:2}
.c1{left:75px}.c2{left:123px}.c3{left:171px}
.flame{position:absolute;bottom:183px;width:19px;height:28px;background:#ffb52e;border-radius:50% 50% 50% 0;transform:rotate(-45deg);animation:flicker .45s infinite alternate;z-index:3;filter:drop-shadow(0 0 12px #ffae35)}
.f1{left:72px}.f2{left:120px}.f3{left:168px}
@keyframes flicker{to{transform:rotate(-42deg) scale(.85) translateY(2px)}}
.cake.cut .flame{animation:none;opacity:0;transform:translateY(-40px);transition:.5s}
.cake.cut{transform:rotate(-2deg);transition:.5s}
.wish{font-size:1.1rem;font-weight:700;color:#c84773;min-height:32px}
.quote{font-family:Pacifico;font-size:clamp(1.7rem,7vw,3.2rem);line-height:1.35;color:#d94c7d}
.final{font-size:clamp(3rem,13vw,6.5rem);color:#ff477e;line-height:1.05}
.small{font-size:.85rem;color:#876b78}
.music{display:flex;align-items:center;gap:14px;justify-content:center;margin:22px auto;padding:12px 16px;background:#ffffff9e;border:1px solid #fff;border-radius:999px;max-width:330px}
.dot{width:12px;height:12px;background:#ff477e;border-radius:50%;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px #ff477e22}}
#particles{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.p{position:absolute;top:-30px;animation:fall linear forwards;opacity:.9}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:0}}
.progress{position:fixed;top:0;left:0;height:4px;background:#ff477e;z-index:50;transition:.4s;width:0}
.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:7px;background:#ffffffaa;backdrop-filter:blur(14px);border:1px solid #fff;border-radius:999px;z-index:40;box-shadow:0 10px 30px #8d456322}
.nav button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;cursor:pointer;color:#b45a79;font-weight:700}
.nav button.on{background:#ff477e;color:#fff}
@media(max-width:520px){.screen{padding-left:14px;padding-right:14px}.funny-grid{gap:9px}.joke{padding:15px;min-height:110px;font-size:.9rem}.envelope{transform:scale(.88);margin-left:-6%;margin-right:-6%}}

/* Premium additions */
#gate{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#fff3f8,#f7efff);display:flex;align-items:center;justify-content:center;padding:22px}
.gate-card{width:min(480px,100%);padding:34px 24px;text-align:center;border:1px solid #fff;background:#ffffffa8;backdrop-filter:blur(20px);border-radius:34px;box-shadow:0 25px 80px #a84d7222}
.gate-logo{font-size:4rem;animation:float 3s ease-in-out infinite}
.gate-card input{width:100%;border:1px solid #ffd0e0;border-radius:999px;padding:15px 18px;text-align:center;outline:none;margin:15px 0;background:#fff}
.error{min-height:22px;color:#c43d68;font-size:.85rem}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:22px auto}
.timebox{background:#ffffffb8;border:1px solid #fff;border-radius:18px;padding:14px 6px;box-shadow:0 10px 30px #b65a7b16}
.timebox b{display:block;font-size:1.7rem;color:#e94e82}.timebox span{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em}
.reasons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:600px;margin:24px auto}
.reason{background:#fff9;border:1px solid #fff;border-radius:20px;padding:18px;min-height:110px;display:grid;place-items:center;font-weight:600}
.theme{position:fixed;right:14px;top:14px;z-index:60;border:1px solid #fff;background:#ffffffaa;backdrop-filter:blur(12px);width:42px;height:42px;border-radius:50%;cursor:pointer}
.dark{filter:saturate(.9)} .dark .bg{filter:brightness(.55)} .dark .card,.dark .gate-card{color:#fff}.dark .sub,.dark .small{color:#f3dbe5}.dark .joke,.dark .reason,.dark .timebox{background:#3a2330bb;border-color:#ffffff22}
#secret{display:none}
@media(max-width:520px){.reasons{grid-template-columns:1fr 1fr}.countdown{gap:5px}.timebox{padding:10px 4px}}

</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">🎀</div>
    <div class="kicker">A tiny secret for Parul</div>
    <h1 class="script" style="font-size:2.7rem;color:#ff477e">Birthday Surprise</h1>
    <p class="sub">This little world is locked. Enter the secret word to open it. 🔐</p>
    <input id="pass" type="password" placeholder="Enter secret word" autocomplete="off">
    <button class="btn" onclick="unlock()">Unlock the surprise 🔓</button>
    <div class="error" id="err"></div>
    <p class="small">Hint: what do you call her? 👀</p>
  </div>
</div>
<button class="theme" onclick="toggleTheme()" aria-label="Toggle theme">☾</button><div id="app">
<div class="bg"></div><div class="noise"></div><div class="progress" id="progress"></div><div id="particles"></div>

<section class="screen active" id="s0">
  <div class="card">
    <div class="orb">🎁</div>
    <div class="kicker">A tiny secret made with love</div><div class="countdown"><div class="timebox"><b id="dd">--</b><span>Days</span></div><div class="timebox"><b id="hh">--</b><span>Hours</span></div><div class="timebox"><b id="mm">--</b><span>Minutes</span></div><div class="timebox"><b id="ss">--</b><span>Seconds</span></div></div>
    <h1 class="hero-title script">Hey, Sister…</h1>
    <p class="sub">I made something for you. It may contain <b>90% nonsense</b>, 10% emotions and an unnecessarily dramatic amount of pink. 😭💗</p>
    <button class="btn" onclick="go(1);confetti()">Open your surprise ✨</button><br><br><button class="btn alt" onclick="go(1)">Skip intro →</button>
    <p class="small">Best experienced with sound on 🔊</p>
  </div>
</section>

<section class="screen" id="s1">
 <div class="card">
  <span class="badge">💌 PRIVATE MESSAGE FOR PARUL</span>
  <h2 class="section-title script">A little letter…</h2>
  <p class="sub">Tap the envelope. Don't worry, it won't explode. Probably. 😂</p>
  <div class="envelope" id="env" onclick="openLetter()">
   <div class="env-body"></div>
   <div class="letter">
    <h3>Dear Sister,</h3>
    <p>Happy Birthday, Parul! 💗</p>
    <p>Life would definitely be quieter without you… but honestly, it would also be way more boring.</p>
    <p>Thank you for all the laughs, arguments, random moments and memories. You're genuinely one of the most special people in my life.</p>
    <p>Stay happy, stay crazy and keep being you. 🌷</p>
    <p><b>— Your favourite sibling (obviously 😌)</b></p>
   </div>
   <div class="flap"></div>
  </div>
  <div class="actions"><button class="btn" onclick="go(2)">Continue →</button></div>
 </div>
</section>

<section class="screen" id="s2">
 <div class="card">
  <div class="kicker">THE OFFICIAL SISTER REPORT</div>
  <h2 class="section-title script">Things about you 😂</h2>
  <div class="funny-grid">
   <div class="joke"><div><span>😂</span>Professional annoyer</div></div>
   <div class="joke"><div><span>👑</span>Always right… apparently</div></div>
   <div class="joke"><div><span>🍫</span>Snack disappearance expert</div></div>
   <div class="joke"><div><span>💅</span>Drama department: CEO</div></div>
  </div>
  <p class="quote">“But somehow… you're still my favourite sister.”</p>
  <button class="btn" onclick="go(3)">Okay, enough roasting 😭 →</button>
 </div>
</section>

<section class="screen" id="s3">
 <div class="card">
  <div class="kicker">THE MAIN EVENT</div>
  <h2 class="section-title script">Make a wish ✨</h2>
  <div class="cake-wrap">
   <div class="cake" id="cake" onclick="blow()" role="button" aria-label="Blow out the candles"></div>
   <div class="candle c1"></div><div class="candle c2"></div><div class="candle c3"></div>
   <div class="flame f1"></div><div class="flame f2"></div><div class="flame f3"></div>
  </div>
  <p class="wish" id="wish">Tap the cake to blow out the candles 🕯️</p>
  <button class="btn" onclick="blow()">Make the wish ✨</button>
 </div>
</section>


<section class="screen" id="s6">
 <div class="card">
  <div class="kicker">JUST BECAUSE 💗</div>
  <h2 class="section-title script">Why you're special</h2>
  <div class="reasons">
   <div class="reason">🌷 You make ordinary days better.</div>
   <div class="reason">😂 You can make me laugh without trying.</div>
   <div class="reason">🫶 You're always part of my best memories.</div>
   <div class="reason">✨ You deserve every good thing.</div>
   <div class="reason">🎀 You're wonderfully, uniquely you.</div>
   <div class="reason">💗 You're my sister — enough said.</div>
  </div>
  <button class="btn" onclick="go(5)">Now the serious part →</button>
 </div>
</section>

<section class="screen" id="s4">
 <div class="card">
  <div class="orb">🌷</div>
  <div class="kicker">ONE SERIOUS MOMENT</div>
  <h2 class="section-title script">For real though…</h2>
  <p class="sub" style="font-size:1.08rem">
   Behind all the jokes, I just want you to know that I'm really lucky to have you as my sister.
   I hope this year brings you lots of happiness, good memories, success, peace, laughter and everything you've been wishing for. 💗
  </p>
  <p class="quote">“Some people are gifts you don't have to unwrap.”</p>
  <button class="btn" onclick="go(5);confetti()">One last surprise →</button>
 </div>
</section>

<section class="screen" id="s6">
 <div class="card">
  <div class="orb">🎂</div>
  <div class="kicker">18 AUGUST • PARUL'S DAY</div>
  <h1 class="final script">Happy Birthday,<br>Parul! 💗</h1>
  <p class="sub">To the best sister ever — may your day be ridiculously happy, your cake be ridiculously big, and your year be even better. ✨</p>
  <div class="music"><div class="dot"></div><span>Birthday mode: ON 🎶</span></div>
  <button class="btn" onclick="revealSecret()">Open the final secret 💌</button><button class="btn alt" onclick="replay()">Replay the surprise ↻</button><div id="secret" class="quote" style="margin-top:20px">P.S. You are stuck with me forever. 😂💗</div>
  <p class="small">Made especially for you, Sister. 🌸</p>
 </div>
</section>

<div class="nav" id="nav"><button class="on" onclick="go(0)">1</button><button onclick="go(1)">2</button><button onclick="go(2)">3</button><button onclick="go(3)">4</button><button onclick="go(4)">5</button><button onclick="go(5)">6</button><button onclick="go(6)">7</button></div></div><script>
let current=0;
const screens=[...document.querySelectorAll('.screen')], nav=[...document.querySelectorAll('.nav button')];
function go(n){
 current=Math.max(0,Math.min(6,n));
 screens.forEach((s,i)=>s.classList.toggle('active',i===current));
 nav.forEach((b,i)=>b.classList.toggle('on',i===current));
 document.getElementById('progress').style.width=((current)/6*100)+'%';
 window.scrollTo({top:0,behavior:'smooth'});
 if(current===6) confetti(90);
}
function openLetter(){document.getElementById('env').classList.add('open');confetti(18)}
function blow(){
 document.getElementById('cake').classList.add('cut');
 document.getElementById('wish').textContent='Wish sent into the universe! ✨💗';
 confetti(55);
 setTimeout(()=>go(5),1300);
}
function revealSecret(){document.getElementById('secret').style.display='block';confetti(70)}
function toggleTheme(){document.body.classList.toggle('dark')}
function unlock(){
 const v=document.getElementById('pass').value.trim().toLowerCase();
 if(v==='sister'||v==='parul'||v==='didi'){
  document.getElementById('gate').style.display='none'; localStorage.setItem('parulUnlocked','1'); confetti(25);
 } else document.getElementById('err').textContent='Hmm… wrong secret 😭 Try “sister”.';
}
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function updateCountdown(){
 const now=new Date(), target=new Date(now.getFullYear(),7,18,0,0,0);
 if(now>target) target.setFullYear(now.getFullYear()+1);
 let x=Math.max(0,target-now);
 const d=Math.floor(x/86400000); x%=86400000;
 const h=Math.floor(x/3600000); x%=3600000;
 const m=Math.floor(x/60000); const sec=Math.floor((x%60000)/1000);
 ['dd','hh','mm','ss'].forEach((id,i)=>document.getElementById(id).textContent=String([d,h,m,sec][i]).padStart(2,'0'));
}
setInterval(updateCountdown,1000);updateCountdown();
if(localStorage.getItem('parulUnlocked')==='1')document.getElementById('gate').style.display='none';
function replay(){document.getElementById('env').classList.remove('open');document.getElementById('cake').classList.remove('cut');document.getElementById('wish').textContent='Tap the cake to blow out the candles 🕯️';go(0)}
function confetti(count=45){
 const box=document.getElementById('particles');
 const icons=['💗','✨','🌸','💕','⭐','🎀','🩷'];
 for(let i=0;i<count;i++){
  const el=document.createElement('div');el.className='p';el.textContent=icons[Math.floor(Math.random()*icons.length)];
  el.style.left=Math.random()*100+'vw';el.style.fontSize=(12+Math.random()*18)+'px';
  el.style.animationDuration=(2.5+Math.random()*3)+'s';el.style.animationDelay=(Math.random()*.35)+'s';
  box.appendChild(el);setTimeout(()=>el.remove(),6000);
 }
}
document.querySelectorAll('button,[role="button"]').forEach(el=>{
 el.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ') && el.tagName!=='BUTTON'){e.preventDefault();el.click();}
 });
});
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight')go(current+1);
 if(e.key==='ArrowLeft')go(current-1);
});
let touchX=0;
document.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});
document.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>70)go(current+(dx<0?1:-1))},{passive:true});
setTimeout(()=>confetti(20),700);
</script>
</body>
</html>
